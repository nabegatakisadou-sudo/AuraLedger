name: Terbitkan ke Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Temukan folder proyek
        run: |
          P=""
          [ -f server.js ] && P="."
          if [ -z "$P" ]; then f=$(find . -maxdepth 3 -name server.js -not -path '*/node_modules/*' | head -n1); [ -n "$f" ] && P=$(dirname "$f"); fi
          if [ -z "$P" ]; then
            z=$(find . -maxdepth 2 -iname '*.zip' | head -n1)
            if [ -n "$z" ]; then mkdir -p _proyek && unzip -q -o "$z" -d _proyek; f=$(find _proyek -maxdepth 3 -name server.js | head -n1); [ -n "$f" ] && P=$(dirname "$f"); fi
          fi
          [ -n "$P" ] || { echo "::error::server.js tidak ditemukan"; exit 1; }
          echo "PROJ=$P" >> "$GITHUB_ENV"
      - name: Siapkan situs statis
        run: |
          rm -rf _site && mkdir _site
          cp -r "$PROJ/public/." _site/
          rm -rf _site/.well-known
          touch _site/.nojekyll
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js -o _site/xlsx.bundle.js
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('_site/index.html')
          h = p.read_text(encoding='utf-8')
          h2 = re.sub(r'<script src="https://cdn\.jsdelivr\.net/npm/xlsx-js-style@1\.2\.0/dist/xlsx\.bundle\.js"[^>]*></script>', '<script src="xlsx.bundle.js"></script>', h)
          assert h2 != h, 'tag skrip xlsx tidak ditemukan'
          p.write_text(h2, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
